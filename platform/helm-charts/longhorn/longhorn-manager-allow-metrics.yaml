---
# Longhorn's chart ships internal network policies (`networkPolicies.
# restrictInternalTraffic`, default true) that only allow same-namespace
# traffic to longhorn-manager, which blocks the Alloy metrics scrape from
# grafana-cloud (the longhorn ServiceMonitor is enabled and targets the
# manager port, 9500). k8s NetworkPolicies union, so this narrow allow
# supplements the chart's policies instead of replacing them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-metrics
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana-cloud
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-metrics
      ports:
        - port: 9500
          protocol: TCP
