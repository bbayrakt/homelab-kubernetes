apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner
  namespace: arc-runners
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-diff-preview
  namespace: argocd-diff-preview
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-diff-preview
  namespace: argocd-diff-preview
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
roleRef:
  kind: Role
  name: arc-runner-diff-preview
  apiGroup: rbac.authorization.k8s.io
---
# Read access to the vcluster namespace so `vcluster connect` can discover
# the vcluster workload and read the exported kubeconfig Secret
# (vc-vcluster) that the PR preview workflow uses to reach the
# virtual cluster.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-vcluster-connect
  namespace: vcluster
rules:
  - apiGroups: [""]
    resources: ["secrets", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-vcluster-connect
  namespace: vcluster
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
roleRef:
  kind: Role
  name: arc-runner-vcluster-connect
  apiGroup: rbac.authorization.k8s.io
---
# Per-PR preview vClusters (namespace preview-pr-<N>, vCluster
# vcluster-pr-<N>): the runner creates and destroys one vCluster per PR and
# exports CRDs from the cluster for the preview baseline. Cluster-scoped
# because preview namespaces are created dynamically per PR.
#
# The rule set deliberately covers EVERY (group, resource, verb) the
# vcluster chart 0.36.x grants in its own `vc-<name>` Role (verified from
# the chart's templates): Kubernetes' RBAC escalation check forbids
# creating a Role whose permissions the caller does not already hold, so a
# too-tight list breaks `vcluster create` with "forbidden: attempting to
# grant RBAC permissions not currently held". Keep this list in sync when
# bumping the vcluster chart. Plus the CLI's own needs (namespaces,
# statefulset lifecycle) and the preview LimitRange/CRD-baseline steps.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-preview-vclusters
rules:
  # vcluster CLI: creates/deletes the per-PR namespace on the host.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Full CRUD set granted to the chart's own Role (plus services/
  # serviceaccounts/secrets created by the helm install itself).
  - apiGroups: [""]
    resources:
      - "configmaps"
      - "endpoints"
      - "persistentvolumeclaims"
      - "pods"
      - "pods/attach"
      - "pods/exec"
      - "pods/portforward"
      - "secrets"
      - "serviceaccounts"
      - "services"
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Chart Role: status/escalation subresources (patch/update only).
  - apiGroups: [""]
    resources: ["pods/status", "pods/ephemeralcontainers", "pods/resize"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "get", "list", "watch"]
  # Preview namespace guardrails (LimitRange applied by the workflow).
  - apiGroups: [""]
    resources: ["limitranges"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Chart Role + CLI lifecycle (helm install/uninstall of the StatefulSet).
  - apiGroups: ["apps"]
    resources: ["statefulsets", "replicasets", "deployments", "daemonsets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Chart Role: endpoint slice discovery.
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Chart Role: events in both API groups.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "get", "list", "watch"]
  # Helm install of the chart's Role/RoleBinding/ServiceAccount.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Leader election inside the preview namespace.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Read-only: CRD baseline export for the preview vClusters.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-preview-vclusters
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
roleRef:
  kind: ClusterRole
  name: arc-runner-preview-vclusters
  apiGroup: rbac.authorization.k8s.io
