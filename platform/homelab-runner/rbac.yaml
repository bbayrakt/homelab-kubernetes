apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner
  namespace: arc-runners
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-diff-preview
  namespace: argocd-diff-preview
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-diff-preview
  namespace: argocd-diff-preview
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
roleRef:
  kind: Role
  name: arc-runner-diff-preview
  apiGroup: rbac.authorization.k8s.io
---
# Read access to the vcluster namespace so `vcluster connect` can discover
# the vcluster workload and read the exported kubeconfig Secret
# (vc-vcluster) that the PR preview workflow uses to reach the
# virtual cluster.
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-vcluster-connect
  namespace: vcluster
rules:
  - apiGroups: [""]
    resources: ["secrets", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-vcluster-connect
  namespace: vcluster
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
roleRef:
  kind: Role
  name: arc-runner-vcluster-connect
  apiGroup: rbac.authorization.k8s.io
---
# Per-PR preview vClusters (namespace preview-pr-<N>, vCluster
# vcluster-pr-<N>): the runner creates and destroys one vCluster per PR and
# exports CRDs from the cluster for the preview baseline. Cluster-scoped
# because preview namespaces are created dynamically per PR; the resource
# types are limited to what the vcluster chart/CLI need, plus read-only
# CRD access. The vcluster CLI installs its own chart into the preview
# namespace (statefulset, service, SA, roles, kubeconfig secret, ...), so
# those namespaced types must be manageable there.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-preview-vclusters
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources:
      - "pods"
      - "services"
      - "configmaps"
      - "secrets"
      - "serviceaccounts"
      - "persistentvolumeclaims"
      - "events"
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments", "daemonsets", "replicasets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-preview-vclusters
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
roleRef:
  kind: ClusterRole
  name: arc-runner-preview-vclusters
  apiGroup: rbac.authorization.k8s.io
