apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spegel-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/spegel-org/helm-charts/spegel
    targetRevision: 0.7.4
    helm:
      releaseName: spegel
      values: |
        spegel:
          containerdRegistryConfigPath: /etc/cri/conf.d/hosts
  destination:
    namespace: spegel
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
