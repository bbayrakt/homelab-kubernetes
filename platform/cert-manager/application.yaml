apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-app
  namespace: argocd
spec:
  project: default
  source:

    repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      releaseName: cert-manager
      parameters:
        - name: installCRDs
          value: "true"
        # Enable the gateway-shim controller so cert-manager provisions certs
        # from the cert-manager.io/issuer+hostname annotations on HTTPRoutes.
        - name: featureGates
          value: "GatewayAPI=true"
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
