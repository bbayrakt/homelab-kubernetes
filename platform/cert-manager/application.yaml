apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-app
  namespace: argocd
spec:
  project: default
  source:

    repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      releaseName: cert-manager
      # Enable Gateway API support (the gateway-shim that issues certs for
      # cert-manager.io annotations on HTTPRoutes). Since cert-manager 1.15 this
      # is a controller config flag, not a feature-gate.
      values: |
        config:
          gatewayAPI:
            enabled: true
      parameters:
        - name: installCRDs
          value: "true"
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
