---
# Cilium Envoy Gateway terminating HTTP + HTTPS on fixed address 192.168.0.200
# (LB-IPAM). Accepts routes from any namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: gateway
  annotations:
    # cert-manager gateway-shim: issue a cert for this listener's hostname and
    # store it in the certificateRefs Secret (argocd-tls) in this namespace,
    # using the ClusterIssuer (cluster-scoped, so no namespaced Issuer needed).
    cert-manager.io/cluster-issuer: letsencrypt-dns01
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.0.200
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: argocd.icaninto.space # cert-manager uses this as the cert dnsName
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-tls # provisioned by cert-manager into this namespace
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All