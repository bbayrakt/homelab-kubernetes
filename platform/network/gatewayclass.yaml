apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
  description: Default Cilium GatewayClass (LB-IPAM + L2 announcements)
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: cilium-config
    namespace: gateway
---
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: cilium-config
  namespace: gateway
spec:
  service:
    type: LoadBalancer
