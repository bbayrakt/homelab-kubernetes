# Cilium GatewayClass — Cilium v1.16+ does NOT create a default GatewayClass;
# you must define it. The `homelab` Gateway references gatewayClassName: cilium.
# A LoadBalancer service type triggers LB-IPAM to allocate 192.168.0.200 from
# the homelab-lb pool (announced via L2), which external-dns then publishes.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium
spec:
  controllerName: io.cilium/gateway-controller
  description: Default Cilium GatewayClass (LB-IPAM + L2 announcements)
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: cilium-config
    namespace: gateway
---
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: cilium-config
  namespace: gateway
spec:
  service:
    type: LoadBalancer