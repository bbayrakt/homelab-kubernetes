apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    cert-manager.io/issuer: letsencrypt-dns01
    cert-manager.io/hostname: argocd.icaninto.space
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: https
  hostnames:
    - argocd.icaninto.space
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
