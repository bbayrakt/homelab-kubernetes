# Helm values for the Argo CD instance that runs inside the preview vCluster.
# Installed by .github/workflows/pr-preview.yaml on every PR run
# (helm upgrade --install argocd-preview argo-cd --values <this file>).
# Minimal instance: ClusterIP service, no ingress, insecure HTTP on :8080 so
# argocd-diff-preview can reach it via port-forward.
fullnameOverride: argocd-preview
server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
configs:
  params:
    server.insecure: true
