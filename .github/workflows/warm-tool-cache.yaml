name: Warm Runner Tool Cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/warm-tool-cache.yaml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: warm-tool-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: argocd-diff-runner
    timeout-minutes: 20
    env:
      VCLUSTER_VERSION: v0.36.1
      ARGOCD_DIFF_PREVIEW_VERSION: v0.2.12
      GH_CLI_VERSION: v2.97.0
      KIND_VERSION: v0.32.0
    steps:
      - name: Prepare cache directories
        run: |
          sudo mkdir -p /opt/tool-cache/manual/bin /opt/tool-cache/runner
          sudo chown -R 1000:1000 /opt/tool-cache/runner

      - uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 1.36.3 # keep in sync with kubernetes_version in infra/env.hcl

      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Install vcluster CLI
        run: |
          set -eu
          dir="/opt/tool-cache/manual/vcluster-${VCLUSTER_VERSION}"
          if [ ! -x "${dir}/vcluster" ]; then
            curl -fSL --retry 3 -o /tmp/vcluster-linux-amd64 \
              "https://github.com/loft-sh/vcluster/releases/download/${VCLUSTER_VERSION}/vcluster-linux-amd64"
            sudo mkdir -p "${dir}"
            sudo install -m 0555 /tmp/vcluster-linux-amd64 "${dir}/vcluster"
          fi
          sudo ln -sfn "${dir}/vcluster" /opt/tool-cache/manual/bin/vcluster

      - name: Install argocd-diff-preview
        run: |
          set -eu
          dir="/opt/tool-cache/manual/argocd-diff-preview-${ARGOCD_DIFF_PREVIEW_VERSION}"
          if [ ! -x "${dir}/argocd-diff-preview" ]; then
            curl -fSL --retry 3 -o /tmp/argocd-diff-preview.tar.gz \
              "https://github.com/dag-andersen/argocd-diff-preview/releases/download/${ARGOCD_DIFF_PREVIEW_VERSION}/argocd-diff-preview-Linux-x86_64.tar.gz"
            sudo mkdir -p "${dir}"
            tar -xzf /tmp/argocd-diff-preview.tar.gz -C /tmp
            sudo install -m 0555 /tmp/argocd-diff-preview "${dir}/argocd-diff-preview"
          fi
          sudo ln -sfn "${dir}/argocd-diff-preview" /opt/tool-cache/manual/bin/argocd-diff-preview

      - name: Install gh CLI
        run: |
          set -eu
          dir="/opt/tool-cache/manual/gh-${GH_CLI_VERSION}"
          if [ ! -x "${dir}/gh" ]; then
            curl -fSL --retry 3 -o /tmp/gh.tar.gz \
              "https://github.com/cli/cli/releases/download/${GH_CLI_VERSION}/gh_${GH_CLI_VERSION#v}_linux_amd64.tar.gz"
            sudo mkdir -p "${dir}"
            tar -xzf /tmp/gh.tar.gz -C /tmp
            sudo install -m 0555 "/tmp/gh_${GH_CLI_VERSION#v}_linux_amd64/bin/gh" "${dir}/gh"
          fi
          sudo ln -sfn "${dir}/gh" /opt/tool-cache/manual/bin/gh

      - name: Install kind
        run: |
          set -eu
          dir="/opt/tool-cache/manual/kind-${KIND_VERSION}"
          if [ ! -x "${dir}/kind" ]; then
            curl -fSL --retry 3 -o /tmp/kind-linux-amd64 \
              "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
            sudo mkdir -p "${dir}"
            sudo install -m 0555 /tmp/kind-linux-amd64 "${dir}/kind"
          fi
          sudo ln -sfn "${dir}/kind" /opt/tool-cache/manual/bin/kind

      - name: Verify cached tools
        run: |
          vcluster version
          argocd-diff-preview --version
          gh --version
          kind version
          kubectl version --client
          helm version --short
