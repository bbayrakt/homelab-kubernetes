name: Warm Runner Tool Cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/warm-tool-cache.yaml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: warm-tool-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: homelab-runner
    timeout-minutes: 20
    steps:
      - name: Prepare cache directories
        run: |
          # The runner image tag is `latest` (mutable), so the UID is derived
          # at runtime instead of hardcoded. Job user = runner user.
          sudo mkdir -p /opt/tool-cache/runner
          sudo chown -R "$(id -u):$(id -g)" /opt/tool-cache/runner
          # One-time cleanup of the leftover `manual/` dir (the CLIs are now
          # installed per-run by pr-preview.yaml); inert leftovers otherwise.
          sudo rm -rf /opt/tool-cache/manual

      - uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 1.36.3 # keep in sync with kubernetes_version in infra/env.hcl

      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Verify cached tools
        run: |
          kubectl version --client
          helm version --short
