# Kubeconfig for the host (control-plane) cluster, built from the runner pod's
# own service account mount. Consumed by .github/workflows/pr-preview.yaml:
# the ARC runner pod has no kubeconfig file, so kubectl/vcluster use this one.
# The tokenFile and certificate-authority paths are constants on every ARC
# runner pod (the runner SA token is mounted at the standard path), so this
# file is fully static and contains no credentials.
apiVersion: v1
kind: Config
clusters:
  - cluster:
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      server: https://kubernetes.default.svc
    name: host
contexts:
  - context:
      cluster: host
      user: arc-runner
    name: host
current-context: host
users:
  - name: arc-runner
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
